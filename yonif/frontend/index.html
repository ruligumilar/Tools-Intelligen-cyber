<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>YONIF TP 807/MNM - Sistem Informasi Personel</title>
    <meta name="description" content="Portal Autentikasi dan Login Sistem Informasi Personel Batalyon Infanteri TP 807/Muluk Nansa Mambri.">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="YONIF TP 807/MNM - Sistem Informasi Personel">
    <meta property="og:description" content="Sistem Informasi Personel Yonif TP 807/MNM - Setia, Tangguh, Perkasa.">
    <meta property="og:type" content="website">

    <!-- Favicon Placeholder -->
    <link rel="icon" type="image/jpeg" href="assets/images/logo.jpg">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Background Overlay Elements -->
    <div class="background-backdrop" aria-hidden="true"></div>
    <div class="ambient-glow" aria-hidden="true"></div>

    <!-- Main Container -->
    <main class="page-container">
        <section class="auth-card" aria-labelledby="auth-title">
            <!-- Header Kesatuan & Logo -->
            <header class="auth-header">
                <div class="logo-wrapper">
                    <img src="assets/images/logo.png" 
                         alt="Logo Yonif TP 807/Muluk Nansa Mambri" 
                         class="unit-logo"
                         loading="eager">
                </div>
                <h1 id="auth-title" class="title">YONIF TP 807/MNM</h1>
                <p class="subtitle">Sistem Informasi Personel</p>
            </header>

            <div class="divider" role="separator"></div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form" autocomplete="off" novalidate>
                <!-- Feedback Message Alert -->
                <div id="formAlert" class="form-alert hidden" role="alert" aria-live="assertive"></div>

                <!-- Field Username -->
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">
                            <!-- User Icon SVG -->
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            class="form-input" 
                            placeholder="Masukkan username" 
                            required 
                            spellcheck="false"
                            autocapitalize="none">
                    </div>
                </div>

                <!-- Field Password -->
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">
                            <!-- Lock Icon SVG -->
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            placeholder="Masukkan password" 
                            required>
                        <button 
                            type="button" 
                            id="togglePassword" 
                            class="toggle-password" 
                            aria-label="Tampilkan atau sembunyikan kata sandi">
                            <!-- Eye Open Icon -->
                            <svg id="eyeIcon" class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <!-- Eye Off Icon (Hidden initially) -->
                            <svg id="eyeOffIcon" class="icon-eye-off hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="btn-submit">
                    <span class="btn-text">MASUK</span>
                    <span class="btn-spinner hidden" aria-hidden="true"></span>
                </button>
            </form>

            <div class="divider" role="separator"></div>

            <!-- Motto Footer -->
            <footer class="auth-footer">
                <p class="motto">SETIA &nbsp;&bull;&nbsp; TANGGUH &nbsp;&bull;&nbsp; PERKASA</p>
            </footer>
        </section>
    </main>

    <!-- Script Application -->
    <script src="js/app.js"></script>
</body>
</html>
